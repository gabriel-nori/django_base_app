services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: django-base-app
    restart: unless-stopped
    environment:
      ENV_NAME: ${ENV_NAME:-PROD}
      SECRET_KEY: ${SECRET_KEY}
      DB_ENGINE: ${DB_ENGINE:-postgresql}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USE_REDIS_CACHE: ${USE_REDIS_CACHE:-true}
      REDIS_DB_INDEX: ${REDIS_DB_INDEX:-1}
      REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_NAME: ${APP_NAME:-Django Base App}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Django Base App API}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_TO_DB: ${LOG_TO_DB:-false}
      LOG_REQUESTS: ${LOG_REQUESTS:-false}
      SERVE_SPA: ${SERVE_SPA:-false}
      SPA_DIR: ${SPA_DIR:-}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - static_volume:/backend/static
    command:
      - /bin/sh
      - -c
      - |
        python manage.py collectstatic --noinput &&
        python manage.py migrate --noinput &&
        python manage.py initialize_objects &&
        gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 4 \
          --threads 2 \
          --worker-class gthread \
          --worker-tmp-dir /dev/shm \
          --log-level info \
          --access-logfile - \
          --error-logfile - \
          --timeout 120 \
          --graceful-timeout 30

volumes:
  static_volume:
