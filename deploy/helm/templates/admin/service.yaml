{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "django-base-app.fullname" . }}-admin
  labels:
    {{- include "django-base-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "django-base-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
{{- end }}

