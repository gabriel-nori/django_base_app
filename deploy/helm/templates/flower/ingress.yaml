{{- if and .Values.flower.enabled .Values.ingress.enabled -}}
{{- $fullName := include "django-base-app.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-flower
  labels:
    {{- include "django-base-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
  annotations:
    # Use Traefik middleware to strip /flower prefix before forwarding to Flower
    traefik.ingress.kubernetes.io/router.middlewares: {{ $fullName }}-flower-strip-prefix@kubernetescrd
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /flower
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-flower" $fullName }}
                port:
                  number: {{ $.Values.flower.port }}
    {{- end }}
{{- end }}

