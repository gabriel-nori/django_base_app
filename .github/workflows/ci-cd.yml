name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  DOCKER_IMAGE_NAME: django-base-app
  DOCKERFILE_PATH: deploy/Dockerfile

jobs:
  # Test job - runs on all pushes and PRs
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: ./backend
        env:
          PYTHONUNBUFFERED: 1
          SECRET_KEY: test-secret-key-for-ci
          ENV_NAME: DEV
          DB_ENGINE: sqlite
          USE_REDIS_CACHE: false
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python manage.py test --noinput

  # Build and push job - only runs on main/master branches and tags
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Extract image tag
        id: tag
        run: |
          # Extract the SHA-based tag from the generated tags (format: branch-sha)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == refs/heads/main ]] || [[ "${{ github.ref }}" == refs/heads/master ]]; then
            BRANCH_NAME="main"
          else
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///' | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
          fi
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Using image tag: ${IMAGE_TAG}"

      - name: Wait for image to propagate
        run: |
          # Wait a few seconds for the image to be fully available in the registry
          # Multi-platform builds may take a moment to propagate
          echo "Waiting 10 seconds for image to propagate in registry..."
          sleep 10
          echo "Image should now be available for ArgoCD to pull"

      - name: Update Helm values with image tag
        run: |
          # Update the image tag in values.yaml
          sed -i "s|tag: \".*\"|tag: \"${{ steps.tag.outputs.tag }}\"|" deploy/helm/values.yaml
          echo "Updated deploy/helm/values.yaml with tag: ${{ steps.tag.outputs.tag }}"
          cat deploy/helm/values.yaml | grep -A 1 "^image:"

      - name: Commit and push updated Helm values
        if: github.event.head_commit == null || github.event.head_commit.author.name != 'github-actions[bot]'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add deploy/helm/values.yaml
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update image tag to ${{ steps.tag.outputs.tag }}"
            git push
            echo "Pushed updated Helm values with image tag: ${{ steps.tag.outputs.tag }}"
          fi

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

