{{- if and .Values.flower.enabled .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "django-base-app.fullname" . }}-flower-strip-prefix
  labels:
    {{- include "django-base-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: flower
spec:
  stripPrefix:
    prefixes:
      - /flower
{{- end }}

